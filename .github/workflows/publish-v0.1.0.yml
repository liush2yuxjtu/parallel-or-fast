name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: '5870fb996b5d358e714d36dd14ec1cca814a5dac'
    steps:
      - name: Verify and package the public snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source dist
          git -C source init --quiet
          git -C source fetch --quiet --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$RELEASE_COMMIT"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$RELEASE_COMMIT"
          git -C source checkout --quiet --detach "$RELEASE_COMMIT"
          python3 -m unittest discover -s source/tests -v
          git -C source archive --format=zip --prefix=parallel-or-fast/ --output="$GITHUB_WORKSPACE/dist/parallel-or-fast-v0.1.0.zip" "$RELEASE_COMMIT"
          git -C source archive --format=zip --output="$GITHUB_WORKSPACE/dist/parallel-or-fast.skill" "$RELEASE_COMMIT:skills"
          cp source/examples/decision-tree.zh-CN.html source/examples/feature-release.mp4 dist/
      - name: Publish the initial release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 already exists."
            exit 0
          fi
          gh release create v0.1.0 dist/* --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "Parallel or Fast? v0.1.0" --notes "Use local coding-agent history to derive personal wait-time cutoffs for parallel chats and Ultrafast. Includes the installable skill, public demo, and offline decision tree. The examples use synthetic session data."
